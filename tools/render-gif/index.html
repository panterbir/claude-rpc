<!doctype html><meta charset="utf-8"><title>render</title>
<body style="margin:0;background:#000;color:#aaa;font:14px sans-serif">
<canvas id="c" width="480" height="480"></canvas><div id="s">hazirlaniyor...</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const W = 480, H = 480, FRAMES = 72, DELAY = 4; // 4cs -> 25 fps, ~2.9 sn dongu
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false); renderer.setClearColor(0x000000, 1);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100); camera.position.set(0, 0, 10.2);
scene.add(new THREE.AmbientLight(0xffffff, 0.35));
const key = new THREE.DirectionalLight(0xffe2d2, 1.15); key.position.set(4, 5, 6); scene.add(key);
const rim = new THREE.DirectionalLight(0x7aa7ff, 0.6); rim.position.set(-6, -2, -4); scene.add(rim);
const warm = new THREE.PointLight(0xff8a5c, 0.8, 30); warm.position.set(0, 0, 7); scene.add(warm);

const N = 12, lens = [3.1,2.2,2.9,2.0,3.2,2.3,2.8,2.1,3.0,2.4,3.0,2.1];
const rIn = 1.0, tipHalf = 0.1, valley = Math.PI / N;
const shape = new THREE.Shape(); let first = true;
function pt(r, a) { const x = Math.cos(a)*r, y = Math.sin(a)*r; if (first) { shape.moveTo(x,y); first = false; } else shape.lineTo(x,y); }
for (let i = 0; i < N; i++) { const a = 2*Math.PI*i/N + 0.13, L = lens[i];
  pt(rIn, a - valley); pt(L*0.97, a - tipHalf); pt(L, a); pt(L*0.97, a + tipHalf); }
shape.closePath();
const geo = new THREE.ExtrudeGeometry(shape, { depth: 1.1, bevelEnabled: true, bevelThickness: 0.16, bevelSize: 0.1, bevelSegments: 5, curveSegments: 4 });
geo.translate(0, 0, -0.55); geo.computeVertexNormals();
const star = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ color: 0xe8743f, metalness: 0.55, roughness: 0.28 }));
const logo = new THREE.Group(); logo.add(star); scene.add(logo); logo.rotation.x = 0.18;

const ctx2 = document.createElement('canvas'); ctx2.width = W; ctx2.height = H;
const c2 = ctx2.getContext('2d', { willReadFrequently: true });
const frames = [];
for (let f = 0; f < FRAMES; f++) {
  logo.rotation.y = 2*Math.PI*f/FRAMES;
  logo.rotation.x = 0.18 + Math.sin(2*Math.PI*f/FRAMES) * 0.08;
  renderer.render(scene, camera);
  c2.drawImage(canvas, 0, 0);
  frames.push(c2.getImageData(0, 0, W, H).data);
}

// ---- median-cut palette (global) ----
const samples = [];
for (let f = 0; f < FRAMES; f += 4) { const d = frames[f]; for (let i = 0; i < d.length; i += 4*5) samples.push([d[i], d[i+1], d[i+2]]); }
let boxes = [samples];
while (boxes.length < 256) {
  let bi = -1, best = 0, ch = 0;
  boxes.forEach((b, i) => { if (b.length < 2) return;
    for (let c = 0; c < 3; c++) { let mn = 255, mx = 0; for (const p of b) { if (p[c] < mn) mn = p[c]; if (p[c] > mx) mx = p[c]; }
      const r = (mx - mn) * Math.sqrt(b.length); if (r > best) { best = r; bi = i; ch = c; } } });
  if (bi < 0) break;
  const b = boxes[bi].sort((x, y) => x[ch] - y[ch]), m = b.length >> 1;
  boxes.splice(bi, 1, b.slice(0, m), b.slice(m));
}
const pal = new Uint8Array(768);
boxes.forEach((b, i) => { let r = 0, g = 0, bl = 0; for (const p of b) { r += p[0]; g += p[1]; bl += p[2]; } const n = b.length || 1;
  pal[i*3] = r/n; pal[i*3+1] = g/n; pal[i*3+2] = bl/n; });
const nPal = boxes.length;
const cache = new Int16Array(32768).fill(-1);
function idx(r, g, b) {
  const k = ((r>>3)<<10) | ((g>>3)<<5) | (b>>3); let v = cache[k]; if (v >= 0) return v;
  let bd = 1e9; v = 0;
  for (let i = 0; i < nPal; i++) { const dr = pal[i*3]-r, dg = pal[i*3+1]-g, db = pal[i*3+2]-b, d = dr*dr+dg*dg+db*db; if (d < bd) { bd = d; v = i; } }
  return cache[k] = v;
}

// ---- GIF writer ----
const out = [];
const w16 = v => out.push(v & 255, (v >> 8) & 255);
'GIF89a'.split('').forEach(ch => out.push(ch.charCodeAt(0)));
w16(W); w16(H); out.push(0xF7, 0, 0);
for (let i = 0; i < 768; i++) out.push(pal[i]);
out.push(0x21, 0xFF, 0x0B); 'NETSCAPE2.0'.split('').forEach(ch => out.push(ch.charCodeAt(0))); out.push(3, 1, 0, 0, 0);
function lzw(pixels) {
  const bytes = []; let cur = 0, nb = 0;
  const put = (code, bits) => { cur |= code << nb; nb += bits; while (nb >= 8) { bytes.push(cur & 255); cur >>= 8; nb -= 8; } };
  let bits = 9, next = 258, dict = new Map(); put(256, bits);
  let prefix = pixels[0];
  for (let i = 1; i < pixels.length; i++) {
    const c = pixels[i], key = prefix * 256 + c, hit = dict.get(key);
    if (hit !== undefined) { prefix = hit; continue; }
    put(prefix, bits);
    if (next < 4096) { dict.set(key, next++); if (next > (1 << bits) && bits < 12) bits++; }
    else { put(256, bits); dict = new Map(); next = 258; bits = 9; }
    prefix = c;
  }
  put(prefix, bits); put(257, bits); if (nb > 0) bytes.push(cur & 255);
  return bytes;
}
for (let f = 0; f < FRAMES; f++) {
  const d = frames[f], px = new Uint8Array(W*H);
  for (let i = 0, j = 0; i < d.length; i += 4, j++) px[j] = idx(d[i], d[i+1], d[i+2]);
  out.push(0x21, 0xF9, 4, 0, DELAY & 255, DELAY >> 8, 0, 0);
  out.push(0x2C); w16(0); w16(0); w16(W); w16(H); out.push(0, 8);
  const data = lzw(px);
  for (let p = 0; p < data.length; p += 255) { const n = Math.min(255, data.length - p); out.push(n); for (let k = 0; k < n; k++) out.push(data[p+k]); }
  out.push(0);
}
out.push(0x3B);
fetch('/save', { method: 'POST', body: new Uint8Array(out) }).then(() => { document.getElementById('s').textContent = 'bitti: ' + out.length + ' bayt'; });
</script>
